name: Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snake-output
  cancel-in-progress: false
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: samir-sah
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2358a6ff
            dist/snake-light.svg?palette=github-light&color_snake=%2358a6ff
      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "chore: update snake"
