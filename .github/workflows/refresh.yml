name: Refresh profile hero

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - photo.png
      - scripts/hero.py
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: profile-hero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate theme-aware hero
        run: python scripts/hero.py photo.png --out assets

      - name: Validate generated SVG
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in (Path('assets/hero-light.svg'), Path('assets/hero-dark.svg')):
              ET.parse(path)
              print(f'validated {path}')
          PY

      - name: Commit changed assets
        run: |
          git add assets/hero-light.svg assets/hero-dark.svg
          if git diff --cached --quiet; then
            echo 'Hero assets are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile hero'
          git push
