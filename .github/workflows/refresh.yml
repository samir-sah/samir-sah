name: Refresh
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Pillow
        run: pip install pillow
      
      - name: Generate portrait
        run: |
          python scripts/dotify.py photo.png -o assets/portrait.svg --cols 88 --equalize --detail 0.5 --circle
          python scripts/dotify.py photo.png -o assets/portrait-dark.svg --cols 88 --equalize --detail 0.5 --circle --invert
          python scripts/dotify.py photo.png -o assets/portrait-light.svg --cols 88 --equalize --detail 0.5 --circle
      
      - name: Generate skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar-skills
      
      - name: Generate language radar
        run: python scripts/radar.py --github samir-sah -o assets/radar-langs --limit 7 --values --curve 0.4 --exclude "shell,html,css,dockerfile,makefile,batchfile,procfile"
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Generate cards
        run: python scripts/cards.py --user samir-sah --out assets
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait*.svg assets/radar-skills-dark.svg assets/radar-skills-light.svg assets/radar-langs-dark.svg assets/radar-langs-light.svg assets/card-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh radar charts, cards, and portrait"
            git push
          else
            echo "No changes to commit"
          fi